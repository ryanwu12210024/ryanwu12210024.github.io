---
layout: default
title: Contact Me
---
<section class="not-prose space-y-6">
    <h1 class="text-3xl font-semibold">
        Leave a message!
    </h1>
    <p>If you would like to get in touch with me, please feel free to reach out!
    </p>
    <div class="grid gap-12 md:grid-cols-2 items-start">
        <!-- Left side: contact form -->
        <form id="contact-form">
            <!-- Name -->
            <label for="name" class="block text-teal-900 font-semibold">Name</label>
            <input class="flex items-center rounded-md bg-white/5 pl-3 outline-1 -outline-offset-1 outline-teal-700 focus-within:outline-2 focus-within:-outline-offset-2 focus-within:outline-indigo-500"
            type="text" id="name" name="name" placeholder="Your Name" required>
            <!-- Email -->
            <label for="email" class="block text-teal-900 font-semibold">Email</label>
            <input class="flex items-center rounded-md bg-white/5 pl-3 outline-1 -outline-offset-1 outline-teal-700 focus-within:outline-2 focus-within:-outline-offset-2 focus-within:outline-indigo-500"
            type="email" id="email" name="email" placeholder="Your Email" required>
            <!-- Message -->
            <label for="message" class="block text-teal-900 font-semibold">Message</label>
            <textarea class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-slate-950 outline-1 -outline-offset-1 outline-teal-700 placeholder:text-gray-400 placeholder:text-base focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
            id="message" name="message" style="height: 280px; width: 450px" placeholder="Your Message" required></textarea>
            <!-- Submit Button -->
            <button type="submit" class="mt-4 px-4 py-2 text-slate-50 bg-purple-700 font-semibold rounded-md hover:bg-purple-500">
                Send Message
            </button>
        </form>

        <!-- Right side: c. elegans meme -->
        <div class="mt-4 rounded-lg shadow-lg" 
        style="background-color: #f9fafb; width: 300px; height: 300px; padding: 16px; display: flex; justify-content: center; align-items: center;">
            <img src="/assets/images/worm-meme.svg" 
            alt="Worm meme" 
            />
        </div>
    </div> 
</section>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="js/contact-form.js"></script>
