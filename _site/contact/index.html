<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        
            Contact Me | Ryan Wu
        
    </title>
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="/favicon/site.webmanifest">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/tailwind.css">
</head>

<body class="text-slate-900 antialiased">
    <header 
class="site-header sticky top-0 z-50 backdrop-blur">
  <nav class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2 hover:opacity-80">
        <img
        src="/assets/icons/RW logo.svg"
        alt="Ruilin Wu logo"
        class="block h-15 w-15"
        />

      <span class="font-semibold text-teal-900 tracking-tight text-3xl">
        Ryan Wu
      </span>
    </a>


    <div class="flex items-center gap-5 text-sm font-semibold text-teal-900">
      <a class="rounded-md px-2 py-1 hover:bg-cyan-800 hover:text-slate-50" href="/about/">About</a>
      <a class="rounded-md px-2 py-1 hover:bg-cyan-800 hover:text-slate-50" href="/research/">Research</a>
      <a class="rounded-md px-2 py-1 hover:bg-cyan-800 hover:text-slate-50" href="/projects/">Projects</a>
      <a class="rounded-md px-2 py-1 hover:bg-cyan-800 hover:text-slate-50" href="/resume/">Resume</a>
      <a class="rounded-md px-2 py-1 hover:bg-cyan-800 hover:text-slate-50" href="/contact/">Leave a message!</a>
    </div>
  </nav>
</header>


    <main class=" bg-white/80 max-w-5xl mx-auto px-6 py-14 prose prose-slate">
        <div class="leading-relaxed">
            <section class="not-prose space-y-6">
    <h1 class="text-3xl font-semibold">
        Leave a message!
    </h1>
    <p>If you would like to get in touch with me, please feel free to reach out!
    </p>
    <div class="grid gap-12 md:grid-cols-2 items-start">
        <!-- Left side: contact form -->
        <form id="contact-form">
            <!-- Name -->
            <label for="name" class="block text-teal-900 font-semibold">Name</label>
            <input class="flex items-center rounded-md bg-white/5 pl-3 outline-1 -outline-offset-1 outline-teal-700 focus-within:outline-2 focus-within:-outline-offset-2 focus-within:outline-indigo-500"
            type="text" id="name" name="name" placeholder="Your Name" required>
            <!-- Email -->
            <label for="email" class="block text-teal-900 font-semibold">Email</label>
            <input class="flex items-center rounded-md bg-white/5 pl-3 outline-1 -outline-offset-1 outline-teal-700 focus-within:outline-2 focus-within:-outline-offset-2 focus-within:outline-indigo-500"
            type="email" id="email" name="email" placeholder="Your Email" required>
            <!-- Message -->
            <label for="message" class="block text-teal-900 font-semibold">Message</label>
            <textarea class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-slate-950 outline-1 -outline-offset-1 outline-teal-700 placeholder:text-gray-400 placeholder:text-base focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
            id="message" name="message" style="height: 280px; width: 450px" placeholder="Your Message" required></textarea>
            <!-- Submit Button -->
            <button type="submit" class="mt-4 px-4 py-2 text-slate-50 bg-purple-700 font-semibold rounded-md hover:bg-purple-500">
                Send Message
            </button>
        </form>

        <!-- Right side: c. elegans meme -->
        <div class="mt-4 rounded-lg shadow-lg" 
        style="background-color: #f9fafb; width: 300px; height: 300px; padding: 16px; display: flex; justify-content: center; align-items: center;">
            <img src="/assets/images/worm-meme.svg" 
            alt="Worm meme" 
            />
        </div>
    </div> 
</section>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="js/contact-form.js"></script>
        </div>
    </main>

    <footer class="border-t border-slate-100">
        <div class="max-w-5xl mx-auto px-6 py-8 text-sm text-slate-500">
            © 2025 Ruilin Wu. All rights reserved.
            <a class="underline hover:text-slate-700" href="mailto:rywu@davidson.edu">rywu@davidson.edu</a>
        </div>
    </footer>
</body>
</html>
