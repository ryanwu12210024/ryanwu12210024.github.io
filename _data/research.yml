- title: "Identifying EOR-1 Binding Sites and Chromatin Accessibility in Relation to NHR-25 in <em>C. elegans</em>"
  year: "Summer 2025 - Present"
  role: "Undergraduate Researcher, Davidson College"
  advisor: "Prof. Deborah Thurtle-Schmidt"
  summary: >
    Investigating the role of EOR-1 as a pioneer factor
    in regulating NHR-25 binding and chromatin accessibility in
    <em>C. elegans</em>.<br><br>
    Optimized ATAC-seq and CUT&RUN protocols for increasing data quality with higher cell viability after homogenization.<br><br>
    Built custom bioinformatics pipelines in Python and R for processing and analyzing sequencing data, including differential accessibility and peak calling analyses.
  methods:
    - ATAC-seq
    - CUT&RUN
    - Python, Bash & R
    - Diffential analysis & peak calling
  highlights:
    - Poster presentations at Davidson College Fall Research Symposium and ABRCMS 2025
  poster:
    - /assets/documents/F25.pdf

- title: "Fibrillation Kinetics of Human Lysozyme under Crowding Conditions"
  year: "Spring 2025"
  role: "Undergraduate Researcher, Davidson College"
  advisor: "Prof. Jeffrey Myers"
  summary: >
    Studied amyloid fibrillation behavior of human lysozyme under
    saccharide and synthetic crowding agents using fluorescence-based
    kinetic assays. <br><br>
    Compared aggregation dynamics across lysozyme
    variants to assess sequence-dependent effects.
  methods:
    - Fluorescence spectroscopy
    - Sigmoidal regression analysis
    - BLAST sequence analysis
  highlights:
    - Poster presentations at Davidson College Verna Case Symposium, Spring 2025
  poster:
    - /assets/documents/Sp25.pdf

